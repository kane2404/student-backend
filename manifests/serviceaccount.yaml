# Un ServiceAccount dédié par charge de travail, sans accès à l'API Kubernetes.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: student-backend
  labels:
    app.kubernetes.io/name: student-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: student-management
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: student-postgres
  labels:
    app.kubernetes.io/name: student-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: student-management
automountServiceAccountToken: false
