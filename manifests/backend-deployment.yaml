apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-backend
  labels:
    app.kubernetes.io/name: student-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: student-management
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: student-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: student-management
    spec:
      serviceAccountName: student-backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          # Nom court : le registre et le tag sont définis par la section `images:` des overlays.
          image: student-backend
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: student-backend-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: student-db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-credentials
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: student-db-credentials
                  key: POSTGRES_DB
          # Le démarrage attend PostgreSQL et applique les migrations : on laisse jusqu'à ~2 min.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 3
            failureThreshold: 40
          # Prêt = base joignable et migrations appliquées.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
