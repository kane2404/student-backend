apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: student-postgres
  labels:
    app.kubernetes.io/name: student-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: student-management
spec:
  serviceName: student-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: student-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: student-management
    spec:
      serviceAccountName: student-postgres
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # UID/GID de l'utilisateur "postgres" de l'image alpine.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          # Le tag est surchargé par la section `images:` des overlays (miroir de registre, épinglage).
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: student-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: student-db-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: student-db-credentials
                  key: POSTGRES_DB
            # Sous-répertoire du volume : évite le dossier "lost+found" à la racine du PVC.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: student-postgres
          app.kubernetes.io/part-of: student-management
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName : laissé vide = classe par défaut du cluster (à fixer dans un overlay si besoin).
        resources:
          requests:
            storage: 5Gi
